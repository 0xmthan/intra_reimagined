# Intra Reimagined API + Postgres + Cloudflare Tunnel.
# All you need on the host is this file and a filled-in .env (see .env.example), then:
#   docker compose up -d                      (app + db)
#   docker compose --profile tunnel up -d     (+ Cloudflare Tunnel)
# Update: docker compose pull && docker compose up -d
name: intra-reimagined

services:
  app:
    image: ghcr.io/0xmthan/intra-reimagined-server:latest
    pull_policy: always
    container_name: intra-reimagined-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FT_UID: ${FT_UID}
      FT_SECRET: ${FT_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      PUBLIC_URL: ${PUBLIC_URL}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://profile.intra.42.fr}
      TRUST_PROXY: '1' # requests arrive through the tunnel
    volumes:
      - ./releases:/app/releases:ro # signed .xpi files + updates.json (pnpm release copies them here)
    ports:
      - '127.0.0.1:${PORT:-8787}:8787' # local access only; the public way in is the tunnel
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8787/health']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  db:
    image: postgres:18
    container_name: intra-reimagined-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql # Postgres 18+ keeps its data in a versioned folder under here
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: intra-reimagined-cloudflared
    restart: unless-stopped
    profiles: [tunnel] # only with: docker compose --profile tunnel up -d
    depends_on:
      app:
        condition: service_healthy
    environment:
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  pgdata:
