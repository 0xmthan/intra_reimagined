# Builds the API server image and pushes it to GitHub Container Registry as :latest.
# On the host you only need server/docker-compose.yml + a filled-in .env, then: docker compose up -d
name: server image

on:
  push:
    branches: [master]
    paths: ['server/**', '.github/workflows/server-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Image name (lowercase, as the registry requires)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/intra-reimagined-server" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Intra Reimagined API server
          cache-from: type=gha
          cache-to: type=gha,mode=max
